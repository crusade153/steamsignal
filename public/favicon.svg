<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Steam Pulse">
  <title>Steam Pulse</title>
  <!-- 브랜드 마크: 게임패드 + 동접 파형. 색은 styles.css 의 lime(#c3f568)·bg(#101311) 토큰 그대로다.
       XML 주석에는 하이픈 두 개를 쓸 수 없어 CSS 변수명을 그대로 적지 않는다.

       파비콘과 헤더 마크가 이 파일 하나를 함께 쓴다. 여기만 고치면 양쪽이 같이 바뀐다.
       래스터(PNG)로 두지 않는 이유: 16px 탭 아이콘부터 512px 홈 화면까지 한 파일로 또렷해야 하고,
       실제로 예전 favicon.svg 는 확장자만 .svg 인 790KB PNG 라 아예 렌더링되지 않았다. -->
  <rect width="64" height="64" rx="15" fill="#c3f568"/>
  <!-- 패드 몸통. 위는 어깨가 벌어지고, 아래는 두 그립 사이가 얕게 파인다.
       파인 깊이는 몸통 높이의 30% 정도여야 그립이 가늘어 보이지 않는다. -->
  <path fill="#101311" d="M22 20
    H42
    C51 20 57.5 26.5 59.6 35.5
    C61.2 42 58.6 47.5 53 47.5
    C48.5 47.5 44.5 44 41.5 41.5
    C39 39.4 25 39.4 22.5 41.5
    C19.5 44 15.5 47.5 11 47.5
    C5.4 47.5 2.8 42 4.4 35.5
    C6.5 26.5 13 20 22 20 Z"/>
  <!-- 십자 방향키와 버튼 넷은 몸통을 도려낸 자리라 배경과 같은 색이다. -->
  <g fill="#c3f568">
    <rect x="16.7" y="24" width="3.6" height="10" rx="1.2"/>
    <rect x="13.5" y="27.2" width="10" height="3.6" rx="1.2"/>
    <circle cx="45.5" cy="24.5" r="1.95"/>
    <circle cx="50" cy="29" r="1.95"/>
    <circle cx="45.5" cy="33.5" r="1.95"/>
    <circle cx="41" cy="29" r="1.95"/>
  </g>
  <!-- 파형. 아래로 꺾이는 골만 두 그립 사이로 빠져나가 배경에 걸친다 — 이 마크의 유일한 움직임이다.
       좌우 끝은 몸통 밖까지 그어 둔다. 배경과 같은 색이라 넘친 부분은 보이지 않고,
       대신 어느 크기에서도 선이 몸통 가장자리에 정확히 닿는다. -->
  <path fill="none" stroke="#c3f568" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"
        d="M1.5 38 H21.5 L24.5 31.5 L27.5 36 L30.5 23 L35 45.5 L38 33.5 L41 33.5 L42.5 38 H62.5"/>
</svg>
